name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/**
    paths:
      - ShaderGlass.sln
      - .github/workflows/build.yml
      - ShaderGlass/**/*.cpp
      - ShaderGlass/**/*.h
      - ShaderGlass/**/*.hpp
      - ShaderGlass/**/*.rc
      - ShaderGlass/*.vcxproj
      - ShaderGlass/*.vcxproj.filters
      - ShaderGC/**
      - ShaderGen/**
      - External/**
  pull_request:
    branches:
      - master
    paths:
      - ShaderGlass.sln
      - .github/workflows/build.yml
      - ShaderGlass/**/*.cpp
      - ShaderGlass/**/*.h
      - ShaderGlass/**/*.hpp
      - ShaderGlass/**/*.rc
      - ShaderGlass/*.vcxproj
      - ShaderGlass/*.vcxproj.filters
      - ShaderGC/**
      - ShaderGen/**
      - External/**

jobs:
  build:
    runs-on: windows-2022

    env:
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
    - run: Get-PSDrive

    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }} ShaderGlass.sln

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ShaderGlass_${{ env.PLATFORM }}_${{ env.CONFIGURATION }}
        path: .\${{ env.PLATFORM }}\${{ env.CONFIGURATION }}\ShaderGlass.exe
        if-no-files-found: error
        overwrite: true
